name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build the book
        run: |
          mkdir -p docs/node_modules/honkit-plugin-lang
          cp -R docs/plugin-lang/. docs/node_modules/honkit-plugin-lang/
          NODE_PATH="$PWD/docs/node_modules" npx --yes honkit build docs _site
          find docs/_site -name favicon.ico -exec cp docs/favicon.ico {} \;
          find docs/_site -name apple-touch-icon-precomposed-152.png -exec cp docs/apple-touch-icon.png {} \;
          cp docs/favicon.ico docs/_site/favicon.ico
          cp docs/apple-touch-icon.png docs/_site/apple-touch-icon.png
          printf '%s\n' docs.visiondoc.ai > docs/_site/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
